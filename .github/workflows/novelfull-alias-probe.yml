name: NovelFull metadata discovery probe
on:
  push:
    branches: [ops/novelfull-alias-search-20261124]
    paths: [.github/workflows/novelfull-alias-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect NovelFull public book-search and sitemap discovery, no chapters
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re
          from html.parser import HTMLParser
          class Inspect(HTMLParser):
            def __init__(self): super().__init__(); self.forms=[]; self.links=[]; self.title=False; self.titles=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='form': self.forms.append(a)
              if tag=='input' and self.forms:self.forms[-1].setdefault('inputs',[]).append({k:a.get(k) for k in ('name','type','placeholder')})
              if tag=='a' and a.get('href') and (re.search(r'search|sitemap',a['href'],re.I) or 'keyword' in a['href']):self.links.append(a['href'])
              if tag=='title':self.title=True
            def handle_data(self,t):
              if self.title:self.titles.append(t.strip())
            def handle_endtag(self,tag):
              if tag=='title':self.title=False
          urls=['https://novelfull.com/','https://novelfull.com/robots.txt','https://novelfull.com/sitemap.xml','https://novelfull.com/sitemap_index.xml','https://novelfull.com/search?keyword=Legend%20of%20Swordsman','https://novelfull.com/search?name=Legend%20of%20Swordsman']
          for url in urls:
            try:
              q=urllib.request.Request(url,headers={'User-Agent':'NovelRetriever-Book-Index/1.0'})
              with urllib.request.urlopen(q,timeout=18) as rr:
                b=rr.read(250000).decode('utf-8','ignore');final=rr.geturl();status=rr.status
              a=Inspect();a.feed(b)
              tags=re.findall(r'<loc>([^<]+)</loc>',b)[:10]
              print('PROBE',url,'status',status,'final',final,'bytes',len(b),'title',a.titles[:2], 'forms',a.forms[:4], 'searchlinks',a.links[:12], 'sitemap-locs',tags,flush=True)
              if url.endswith('robots.txt'):print('ROBOTS_TOP',b[:1600].replace('\\n',' | '),flush=True)
            except Exception as e:print('PROBE_ERROR',url,type(e).__name__,str(e)[:180],flush=True)
          PY