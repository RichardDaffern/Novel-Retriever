name: Campaign - NovelFull real search and 100-title bulk wave
on:
  push:
    branches: [ops/novelfull-alias-search-20261124]
    paths: [.github/workflows/novelfull-full-search-bulk-20261124.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: novelfull-alias-100-campaign-20261124
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'RichardDaffern/Novel-Retriever' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned search dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify search parsing, subtitle handling, source identity and exact input
        run: python -m unittest tests.test_novelfull_alias_campaign -v
      - name: Search NovelFull for every missing Excel title, including subtitle-only variants
        run: python -u -m tools.novelfull_alias_campaign discover --out novelfull-match-report.json
      - name: Publish source evidence report without chapter text
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novelfull-100-title-search-${{ github.run_id }}
          path: novelfull-match-report.json
          retention-days: 90
          if-no-files-found: warn
  dispatch:
    needs: discover
    if: needs.discover.result == 'success' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned dispatch dependencies
        run: python -m pip install -r requirements.lock
      - name: Retrieve exact same-run validated source list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: novelfull-100-title-search-${{ github.run_id }}
          path: scan
      - name: Dispatch verified titles in batches of ten when a bulk slot frees
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u -m tools.novelfull_alias_campaign dispatch \
            --source scan/novelfull-match-report.json \
            --out novelfull-bulk-dispatch-report.json
      - name: Save submitted run inputs and outstanding candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novelfull-100-title-bulk-dispatch-${{ github.run_id }}
          path: novelfull-bulk-dispatch-report.json
          retention-days: 90
          if-no-files-found: warn
