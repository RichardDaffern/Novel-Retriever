name: One-shot verify full ReadNovelFull alternatives and dispatch
on:
  push:
    branches: [ops/verified-full-alternative-wave-20261123]
    paths:
      - '.github/workflows/full-alternative-wave-20261123.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: one-shot-full-alternative-wave-20261123
  cancel-in-progress: false

jobs:
  preflight-dispatch:
    if: github.repository == 'RichardDaffern/Novel-Retriever' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned source-index parser
        run: python -m pip install -r requirements.lock

      - name: Validate complete ordered chapter indexes, title and edition (NO chapters downloaded)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.readnovelfull_source import discover

          candidates = [
            {
              "title": "Past Life Returner",
              "url": "https://readnovelfull.com/past-life-returner.html",
              "minimum_chapters": 575,
              "author_contains": "na min chae",
            },
            {
              "title": "World Domination System",
              "url": "https://readnovelfull.com/world-domination-system.html",
              "minimum_chapters": 1167,
            },
          ]
          approved = []
          report = []
          for candidate in candidates:
              result = dict(candidate)
              result["approved"] = False
              try:
                  metadata = discover(candidate["url"])
                  title = metadata["title"].strip()
                  count = metadata["numChapters"]
                  chapters = metadata["chapters"]
                  author = metadata.get("author", "")
                  status = metadata.get("status", "")
                  result.update({
                      "discovered_title": title,
                      "discovered_author": author,
                      "discovered_status": status,
                      "discovered_chapters": count,
                  })
                  if title.casefold() != candidate["title"].casefold():
                      raise ValueError("Book title does not exactly match")
                  if candidate.get("author_contains") and candidate["author_contains"] not in author.casefold():
                      raise ValueError("Expected credited author does not match")
                  if status != "Completed":
                      raise ValueError("Full book not labelled Completed by source")
                  if count < candidate["minimum_chapters"] or len(chapters) != count:
                      raise ValueError("Fewer chapters than verified historical full-length minimum")
                  if [r["position"] for r in chapters] != list(range(1, count + 1)):
                      raise ValueError("Chapter order is not consecutive")
                  if not chapters[-1].get("title") or not chapters[0].get("url"):
                      raise ValueError("Missing first/last chapter metadata")
                  result["approved"] = True
                  result["reason"] = "Metadata-only full-length source index checks passed"
                  approved.append({"title": title, "url": candidate["url"], "chapters": count})
                  print("SOURCE_INDEX_VERIFIED", title, count, flush=True)
              except Exception as error:
                  result["reason"] = str(error)[:500]
                  print("SOURCE_HELD", candidate["title"], result["reason"], flush=True)
              report.append(result)
          Path("full_alternative_preflight.json").write_text(
              json.dumps({"version": 1, "report": report, "approved": approved}, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Verified alternatives:", len(approved), "out of", len(candidates), flush=True)
          PY

      - name: Dispatch only fully validated alternative source URLs, up to two bulk runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/full-alternative-urls.txt
          import json
          from pathlib import Path
          data = json.loads(Path("full_alternative_preflight.json").read_text(encoding="utf-8"))
          for item in data["approved"]:
              print(item["url"])
          PY
          count=0
          while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            active="$(gh api "repos/$GH_REPO/actions/workflows/library-bulk-download.yml/runs?per_page=100" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
            if (( active >= 2 )); then
              echo "::warning::Two existing active bulk runs, holding remaining alternatives"
              break
            fi
            gh workflow run library-bulk-download.yml --ref main \
              --raw-field "novel_urls=$url" \
              --raw-field "force=false" \
              --raw-field "confirm_rights=true"
            count=$((count + 1))
            echo "DISPATCHED_FULL_SOURCE $url"
            sleep 10
          done < /tmp/full-alternative-urls.txt
          echo "Dispatched $count validated full-source bulk workflow(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run list --workflow library-bulk-download.yml --limit 6 >> "$GITHUB_STEP_SUMMARY"

      - name: Publish source-verification evidence without chapter text
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-alternative-source-preflight-20261123
          path: full_alternative_preflight.json
          retention-days: 90
          if-no-files-found: warn
