name: Campaign - Dispatch small Yup pilot batches

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/yup-pilot/requests/batch-*.json'

# Dispatches the existing workflow, rather than moving chapter downloads into
# this dispatcher. Each request starts one separate GitHub Actions pipeline.
permissions:
  contents: read
  actions: write

concurrency:
  group: yup-pilot-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select only newly added pilot batch requests from this push
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'campaigns/yup-pilot/requests/batch-*.json' > /tmp/yup-pilot-added.txt
          echo "New pilot batch request files: $(wc -l < /tmp/yup-pilot-added.txt)"

      - name: Validate approved source URLs and dispatch separate small bulk runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.campaign_yup_dispatch \
            --paths-file /tmp/yup-pilot-added.txt

      - name: Explain individual run tracking
        if: success()
        run: |
          echo '## Independent small Yup downloads' >> "$GITHUB_STEP_SUMMARY"
          echo 'Each approved batch is a separate **Library - Bulk Download** workflow run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source websites and batch workers retain their existing rate limits.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No dropped/excluded title is in the pilot approved URL manifest.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No re-download of already-complete registry URLs unless explicitly forced (not enabled here).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Follow the separate runs under Actions > Library - Bulk Download.' >> "$GITHUB_STEP_SUMMARY"
