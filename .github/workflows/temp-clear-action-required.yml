name: Temporary - Clear obsolete registry approvals

on:
  push:
    branches:
      - chore/clear-registry-action-required-20261115
    paths:
      - .github/workflows/temp-clear-action-required.yml

permissions:
  actions: write
  contents: read

jobs:
  delete-obsolete-no-job-runs:
    if: github.repository == 'RichardDaffern/Novel_Library'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove only finished bot registry PR checks that never executed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -u - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          REPO = "RichardDaffern/Novel_Library"
          BRANCH = "refs/heads/chore/clear-registry-action-required-20261115"
          # Frozen maximum from the user's original Action required list.
          MAX_RUN_ID = 43740907597
          WORKFLOW_ID = 410274135
          TOKEN = os.environ.get("GH_TOKEN")
          if (not TOKEN or os.environ.get("GITHUB_REPOSITORY") != REPO
                  or os.environ.get("GITHUB_REF") != BRANCH
                  or os.environ.get("GITHUB_EVENT_NAME") != "push"):
              raise SystemExit("Unexpected repository, branch or authentication")

          def api(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "NovelLibrary-ActionRequired-HistoryCleanup/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=25) as res:
                  if method == "DELETE":
                      if res.status != 204:
                          raise RuntimeError("Unexpected DELETE result")
                      return None
                  return json.load(res)

          history = api("/actions/runs?status=action_required&per_page=100")
          if history.get("total_count", 0) > 100:
              raise SystemExit("Over 100 pending records; refuse partial cleanup")
          runs = history.get("workflow_runs", [])
          candidates = [
              run for run in runs
              if (isinstance(run.get("id"), int)
                  and run["id"] <= MAX_RUN_ID
                  and run.get("workflow_id") == WORKFLOW_ID
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "action_required"
                  and run.get("event") == "pull_request"
                  and run.get("name") in ("CI", "Test novel library")
                  and (run.get("actor") or {}).get("login") == "github-actions[bot]"
                  and str(run.get("head_branch") or "").startswith("registry/download-"))
          ]
          print(
              "Historical action_required:", len(runs),
              "safely eligible bot-only registry checks:", len(candidates),
              "excluded:", len(runs)-len(candidates),
              flush=True,
          )
          deleted = []
          skipped_nonempty = []
          failed = []
          for run in candidates:
              run_id = run["id"]
              jobs = api(f"/actions/runs/{run_id}/jobs?per_page=1")
              if jobs.get("total_count", -1) != 0:
                  skipped_nonempty.append(run_id)
                  print("SKIP jobs exist:", run_id, flush=True)
                  continue
              try:
                  api(f"/actions/runs/{run_id}", method="DELETE")
                  deleted.append(run_id)
                  print("DELETED obsolete action_required run", run_id, flush=True)
                  time.sleep(0.25)
              except (urllib.error.HTTPError, urllib.error.URLError, RuntimeError) as exc:
                  failed.append((run_id, str(exc)))
                  print("FAILED", run_id, str(exc), flush=True)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write(
                      "## Historical registry CI cleanup\n\n"
                      f"- Deleted obsolete bot-only \`action_required\` runs: **{len(deleted)}**\n"
                      f"- Kept other/unmatched runs: **{len(runs)-len(candidates)}**\n"
                      f"- Skipped because jobs existed: **{len(skipped_nonempty)}**\n"
                      f"- API deletion failures: **{len(failed)}**\n\n"
                      "Only completed GitHub Actions bot-created registry PR checks "
                      "with zero jobs were eligible. Successful/failed workflows, "
                      "download runs and artefacts were not touched.\n"
                  )
          if failed:
              raise SystemExit(f"{len(failed)} deletions failed; see diagnostics")
          PY
