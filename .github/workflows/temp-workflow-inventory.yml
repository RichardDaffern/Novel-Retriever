name: Temporary - Workflow Registry Inventory

on:
  push:
    branches:
      - chore/clear-registry-action-required-20261115
    paths:
      - .github/workflows/temp-workflow-inventory.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List registered Actions workflows without modifying anything
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -u - <<'PY'
          import json
          import os
          import urllib.request
          repo = "RichardDaffern/Novel_Library"
          req=urllib.request.Request(
              "https://api.github.com/repos/"+repo+"/actions/workflows?per_page=100",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req, timeout=20) as resp:
              registered=json.load(resp)
          rows=registered.get("workflows",[])
          print("WORKFLOW_COUNT",registered.get("total_count"),"RETURNED",len(rows))
          for x in rows:
              print("WORKFLOW",x["id"],"STATE",x["state"],"NAME",repr(x["name"]),
                    "PATH",repr(x["path"]))
          PY
