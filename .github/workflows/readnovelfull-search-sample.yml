name: ReadNovelFull actual search results sample
on:
  push:
    branches: [ops/readnovelfull-secondary-wave-20261124]
    paths: [.github/workflows/readnovelfull-search-sample.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch public search pages and list exact book candidates, no chapter text
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re
          from html.parser import HTMLParser
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.data=[];self.cur=None
            def handle_starttag(self,t,attrs):
              a=dict(attrs)
              if t=='a' and a.get('href'):
                self.cur={'url':a['href'],'name':''};self.data.append(self.cur)
            def handle_data(self,s):
              if self.cur:self.cur['name']+=s
            def handle_endtag(self,t):
              if t=='a':self.cur=None
          for title in ['Godly Student','Beauty And The Bodyguard','Doom Lord','Past Life Returner','Eternal Martial Sovereign','Omega Summoner']:
            url='https://readnovelfull.com/novel-list/search?'+urllib.parse.urlencode({'keyword':title})
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NovelRetriever-Book-Index/1.0'}),timeout=12) as r:
                raw=r.read(200000).decode('utf8','ignore');status=r.status;final=r.url
              p=Links();p.feed(raw)
              links=[x for x in p.data if re.search(r'(^|/)\\w[a-z0-9-]*\\.html$',x['url']) and x['name'].strip()]
              print('RESULT',title,'status',status,'final',final,'links',links[:16],flush=True)
            except Exception as e:print('RESULT_ERROR',title,type(e).__name__,str(e)[:170],flush=True)
          PY