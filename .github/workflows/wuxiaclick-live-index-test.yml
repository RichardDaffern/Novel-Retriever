name: Temporary - WuxiaClick Index Validation
on:
  push:
    branches: [feature/wuxiaclick-bounded-download-20261115]
    paths: [.github/workflows/wuxiaclick-live-index-test.yml]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Verify real complete ordered chapter metadata with no chapter-text requests
        run: |
          python -u - <<'PY'
          from tools.wuxiaclick_source import discover, fetch_public_html
          from bs4 import BeautifulSoup
          for slug in ("martial-world","true-martial-world"):
              url="https://wuxia.click/novel/"+slug
              print("INDEX_START",slug,flush=True)
              page=BeautifulSoup(fetch_public_html(url), "html.parser")
              section=page.select_one("#chapters")
              anchors=section.select("a[href]") if section else []
              chapter_links=[a for a in anchors if "/chapter/" in a.get("href","")]
              print("DOM",slug,"section",bool(section),"anchors",len(anchors),
                    "chapter_links",len(chapter_links),"section_tags",
                    [x.name for x in list(section.children)[:8] if getattr(x,"name",None)] if section else None)
              for a in chapter_links[:3]:
                  def tag(n):
                      return (n.name, n.get("id",""), n.get("class",[])[:4]) if n else None
                  print("DOM_LINK",slug,a.get("href"),"ancestors",
                        [tag(a),tag(a.parent),tag(a.parent.parent),
                         tag(a.parent.parent.parent),tag(a.parent.parent.parent.parent)])
              d=discover(url)
              rows=d["chapters"]
              assert len(rows)==d["numChapters"]
              assert [r["position"] for r in rows]==list(range(1,len(rows)+1))
              assert len({r["url"] for r in rows})==len(rows)
              print("INDEX_PASS",slug,"count",len(rows),"first",rows[0]["source_number"],
                    "last",rows[-1]["source_number"],"first_title",repr(rows[0]["title"][:70]),
                    "last_title",repr(rows[-1]["title"][:70]),flush=True)
          PY
