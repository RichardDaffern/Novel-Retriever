name: Temporary - WuxiaClick Index Validation
on:
  push:
    branches: [feature/wuxiaclick-bounded-download-20261115]
    paths: [.github/workflows/wuxiaclick-live-index-test.yml]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Verify real complete ordered chapter metadata with no chapter-text requests
        run: |
          python -u - <<'PY'
          from tools.wuxiaclick_source import discover
          for slug in ("martial-world","true-martial-world"):
              url="https://wuxia.click/novel/"+slug
              print("INDEX_START",slug,flush=True)
              d=discover(url)
              rows=d["chapters"]
              assert len(rows)==d["numChapters"]
              assert [r["position"] for r in rows]==list(range(1,len(rows)+1))
              assert len({r["url"] for r in rows})==len(rows)
              print("INDEX_PASS",slug,"count",len(rows),"first",rows[0]["source_number"],
                    "last",rows[-1]["source_number"],"first_title",repr(rows[0]["title"][:70]),
                    "last_title",repr(rows[-1]["title"][:70]),flush=True)
          PY
