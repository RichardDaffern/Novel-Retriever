name: Temporary - WuxiaClick Metadata Quality
on:
  push:
    branches: [feature/wuxiaclick-bounded-download-20261115]
    paths: [.github/workflows/wuxiaclick-live-index-test.yml]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Verify actual author synopsis and genres from two book pages
        run: |
          python -u - <<'PY'
          from tools.wuxiaclick_source import book_metadata, fetch_public_html
          for slug in ("martial-world", "true-martial-world"):
              url="https://wuxia.click/novel/"+slug
              details=book_metadata(fetch_public_html(url), url)
              print("METADATA",slug,"author",repr(details["author"]),
                    "synopsis_chars",len(details["description"]),
                    "genres",details["genres"][:8],"count",details["numChapters"])
          PY
