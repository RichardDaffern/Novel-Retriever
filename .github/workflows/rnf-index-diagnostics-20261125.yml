name: Diagnose ReadNovelFull catalogue blockers including Legend of Swordsman
on:
  push:
    branches: [ops/rnf-index-diagnostics-20261125]
    paths: [.github/workflows/rnf-index-diagnostics-20261125.yml]
permissions:
  contents: read
jobs:
  index-audit:
    if: github.repository == 'RichardDaffern/Novel-Retriever' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Read public chapter-index metadata and classify duplicate/gap cases
        shell: bash
        run: |
          python - <<'PY'
          from tools.readnovelfull_source import (book_metadata,fetch_public_html,
              archive_url,validate_chapter_url)
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from collections import defaultdict
          from pathlib import Path
          import json, time
          links = {
            "Awakening": "awakening-v1",
            "Flower Master In The City": "flower-master-in-the-city-v1",
            "Heavenly Star": "heavenly-star",
            "This MC Is Kickass": "this-mc-is-kickass-v1",
            "World Domination System": "world-domination-system-v1",
            "Beast Piercing The Heavens": "beast-piercing-the-heavens-v1",
            "Doom Lord": "doom-lord-v1",
            "Godly Student": "godly-student",
            "I'm In Hollywood": "im-in-hollywood-v1",
            "Martial Arts System": "martial-arts-system",
            "Path to Heaven": "path-to-heaven-v1",
            "The Alchemist God": "the-alchemist-god",
            "The Mightiest Leveling System": "the-mightiest-leveling-system-v1",
            "Weapon Master": "weapon-master-v1",
            "Legend of Swordsman": "legend-of-swordsman-v1",
          }
          report=[]
          for title,slug in links.items():
            url=f"https://readnovelfull.com/{slug}.html"
            row={"wanted":title,"url":url}
            try:
              page=fetch_public_html(url)
              meta=book_metadata(page,url)
              raw=fetch_public_html(archive_url(meta["novel_id"]))
              soup=BeautifulSoup(raw,"html.parser")
              anchors=soup.select("ul.list-chapter li a[href], .list-chapter li a[href]")
              numbers=defaultdict(list)
              invalid=[]
              for anchor in anchors:
                href=anchor.get("href","")
                try:
                  canonical,number,prefix=validate_chapter_url(urljoin(url,href))
                except ValueError as e:
                  invalid.append({"href":href,"error":str(e)[:100]})
                  continue
                numbers[number].append({"href":canonical,"label":anchor.get("title") or anchor.get_text(" ",strip=True)})
              duplicate={str(number):items for number,items in numbers.items() if len({x["href"] for x in items})>1}
              numbered=[x for x in numbers if x>0]
              end=max(numbered,default=0)
              absent=[x for x in range(1,end+1) if x not in numbers]
              row.update({"actual":meta["title"],"status":meta["status"],"author":meta["author"],
                          "book_index_items":len(anchors),"unique_numbers":len(numbers),
                          "maximum_chapter_number":end,"gaps":absent[:80],
                          "gap_count":len(absent),"duplicate_count":len(duplicate),
                          "duplicates":dict(list(duplicate.items())[:15]),"invalid":invalid[:15]})
              print("CHAPTER_INDEX",title,"items",len(anchors),"last",end,
                    "gap_count",len(absent),"duplicates",len(duplicate),
                    "invalid",len(invalid),flush=True)
              for number,items in list(duplicate.items())[:4]:
                print("DUPLICATE_DETAILS",title,number,
                      json.dumps(items,ensure_ascii=False)[:480],flush=True)
            except Exception as e:
              row["error"]=str(e)[:400]
              print("CHAPTER_INDEX_ERROR",title,type(e).__name__,str(e)[:200],flush=True)
            report.append(row)
            time.sleep(.6)
          Path("rnf-index-diagnostics.json").write_text(json.dumps(
              {"version":1,"report":report},indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY
      - name: Publish source-index evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rnf-index-diagnostics-${{ github.run_id }}
          path: rnf-index-diagnostics.json
          retention-days: 90
          if-no-files-found: warn
