name: Overnight - Retry one reviewed ReadNovelFull prologue title

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/overnight/retry-reviewed-prologue-20261121.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: one-shot-reviewed-prologue-20261121
  cancel-in-progress: false

jobs:
  retry:
    if: github.repository == 'RichardDaffern/Novel-Retriever' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require one-time addition, not modification or repeat execution
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/overnight/retry-reviewed-prologue-20261121.json' | grep -qx \
            'campaigns/overnight/retry-reviewed-prologue-20261121.json'
      - name: Verify exact reviewed source and non-forced single-title selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path(
              "campaigns/overnight/retry-reviewed-prologue-20261121.json"
          ).read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "novel": "The Alchemist God",
              "site": "ReadNovelFull",
              "url": "https://readnovelfull.com/the-alchemist-god.html",
              "reason": "reviewed genuine prologue support in PR 453",
              "force": False,
          }
          if manifest != expected:
              raise SystemExit("Manifest differs from the exact approved single-title retry")
          PY
      - name: Trigger targeted existing bulk downloader (no source search)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run library-bulk-download.yml \
            --repo RichardDaffern/Novel-Retriever --ref main \
            --field novel_urls=https://readnovelfull.com/the-alchemist-god.html \
            --field chapter_range= --field force=false
          echo 'Triggered single-title verified prologue retry without forcing earlier completed books.' \
            >> "$GITHUB_STEP_SUMMARY"
