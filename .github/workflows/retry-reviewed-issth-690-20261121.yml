name: Overnight - Resume I Shall Seal the Heavens after author omission fix

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/overnight/retry-reviewed-issth-690-20261121.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: one-shot-issth-690-20261121
  cancel-in-progress: false

jobs:
  retry:
    if: github.repository == 'RichardDaffern/Novel-Retriever' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify unique activation on main
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/overnight/retry-reviewed-issth-690-20261121.json' | grep -qx \
            'campaigns/overnight/retry-reviewed-issth-690-20261121.json'
      - name: Check exact reviewed single-title retry selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(
              "campaigns/overnight/retry-reviewed-issth-690-20261121.json"
          ).read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "novel": "I Shall Seal the Heavens",
              "site": "NovelFull",
              "url": "https://novelfull.com/i-shall-seal-the-heavens.html",
              "reason": "verified author-omitted Chapter 690 handling",
              "force": False,
          }
          if data != expected:
              raise SystemExit("Unexpected one-shot ISSTH recovery manifest")
          PY
      - name: Restart this book through existing cache-aware bulk workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run library-bulk-download.yml \
            --repo RichardDaffern/Novel-Retriever --ref main \
            --field novel_urls=https://novelfull.com/i-shall-seal-the-heavens.html \
            --field chapter_range= --field force=false
          echo 'Triggered cache-aware single-book retry; other completed chapters must be reused.' \
            >> "$GITHUB_STEP_SUMMARY"
