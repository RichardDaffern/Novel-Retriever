name: Scribble Hub - Download

on:
  workflow_dispatch:
    inputs:
      novel_url:
        description: 'Scribble Hub series URL (currently registered: 445037 only)'
        required: true
        type: string
        default: 'https://www.scribblehub.com/series/445037/the-adventurous-gamer-ninja--daichi-hekima/'
      confirm_rights:
        description: 'I have explicit rights to archive and publicly share this work through public GitHub Actions artefacts'
        required: true
        type: boolean
        default: false
      rights_evidence_url:
        description: 'Separate HTTPS author/rights-holder permission or licence page. A public book listing is not evidence.'
        required: true
        type: string
      force:
        description: 'Redownload even if a completed artefact is still available'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      novel_url:
        description: 'Registered Scribble Hub series URL'
        required: true
        type: string
      confirm_rights:
        description: 'Explicit permission to archive and publicly share the requested book'
        required: true
        type: boolean
      rights_evidence_url:
        description: 'Separate HTTPS author/rights-holder permission or licence page'
        required: true
        type: string
      force:
        description: 'Redownload even if a completed artefact is available'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

# Same-book requests queue; distinct series can run independently.
concurrency:
  group: scribblehub-crosspost-${{ inputs.novel_url }}
  cancel-in-progress: false
  queue: max

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Require explicit rights evidence before public archive access
        env:
          CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
          RIGHTS_EVIDENCE_URL: ${{ inputs.rights_evidence_url }}
          NOVEL_URL: ${{ inputs.novel_url }}
        run: |
          python tools/rights_gate.py --confirm-rights "$CONFIRM_RIGHTS" --evidence-url "$RIGHTS_EVIDENCE_URL" --source-urls "$NOVEL_URL"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock

      - name: Confirm permissions and verified author cross-post
        id: source
        env:
          NOVEL_URL: ${{ inputs.novel_url }}
          CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
          RIGHTS_EVIDENCE_URL: ${{ inputs.rights_evidence_url }}
        run: |
          python - <<'PY'
          import os
          from tools.scribblehub_crosspost_downloader import _verified_record

          if os.environ["CONFIRM_RIGHTS"] != "true":
              raise SystemExit("Confirm that you have permission to archive this novel.")
          canonical, series_id, _ = _verified_record(os.environ["NOVEL_URL"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"url={canonical}\nseries_id={series_id}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Scribble Hub verified author cross-post\n\n")
              output.write(f"Series ID: {series_id}\n\n")
              output.write("Rights evidence URL (manual review required): " + os.environ["RIGHTS_EVIDENCE_URL"] + "\n\n")
              output.write("Uses the same author's registered FanFiction.net cross-post through FicHub.\n\n")
              output.write("**Privacy:** Artefacts on a public repository may be accessible to others.\n")
          PY

      - name: Check completed-download registry
        id: registry
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(python -m tools.download_registry check --url "$NOVEL_URL")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          "${args[@]}"

      - name: Already downloaded
        if: steps.registry.outputs.skip == 'true'
        run: |
          echo "::notice::A complete unexpired artefact is already recorded; select Force to redownload."
          echo "The requested novel already has an unexpired completed artefact." >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify author cross-post
        id: download
        if: steps.registry.outputs.skip != 'true'
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
          PYTHONUNBUFFERED: '1'
        timeout-minutes: 15
        run: |
          python -u -m tools.scribblehub_crosspost_downloader "$NOVEL_URL" \
            --confirm-rights --output-dir downloaded_zip

      - name: Explain FicHub export failure
        if: ${{ failure() && steps.download.conclusion == 'failure' }}
        run: |
          echo "::error::The author cross-post export failed. Inspect the FicHub error code above."
          echo "### Download failed before publishing any novel" >> "$GITHUB_STEP_SUMMARY"
          echo "FicHub may be temporarily unavailable. Check the error code in the download step." >> "$GITHUB_STEP_SUMMARY"
          echo "If err=-7, the provider has restricted exports: do not retry or bypass it." >> "$GITHUB_STEP_SUMMARY"
          echo "For other failures, wait before trying again; the workflow never publishes partial archives." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare standard novel artefact folder
        if: steps.registry.outputs.skip != 'true'
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
        run: |
          python -u -m tools.scribblehub_crosspost_artifact \
            --archive-dir downloaded_zip \
            --source-url "$NOVEL_URL" \
            --output-dir downloads

      - name: Resolve verified cover and record provenance
        if: steps.registry.outputs.skip != 'true'
        run: python -u -m tools.cover_pipeline --directory downloads

      - name: Upload complete verified novel
        if: steps.registry.outputs.skip != 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novel-${{ github.run_id }}-scribblehub-${{ steps.source.outputs.series_id }}
          path: downloads/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

      - name: Update metadata-only download registry
        if: steps.registry.outputs.skip != 'true'
        env:
          NOVEL_URL: ${{ steps.source.outputs.url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u -m tools.publish_registry \
            --url "$NOVEL_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-url "$ARTIFACT_URL" \
            --downloads-dir downloads
