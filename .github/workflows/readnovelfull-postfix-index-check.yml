name: ReadNovelFull post-fix live chapter index verification
on:
  push:
    branches: [fix/readnovelfull-real-chapter-aliases-20261124]
    paths: [.github/workflows/readnovelfull-postfix-index-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Verify patched adapter accepts historical typo examples without relaxing gaps
        run: python -m unittest tests.test_readnovelfull -v
      - name: Check full metadata/index from the actual five listed source URLs, no prose
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.readnovelfull_source import discover
          from tools.overnight_queue import norm
          candidates=[
            ("Heavenly Star","https://readnovelfull.com/heavenly-star.html",556),
            ("The Alchemist God","https://readnovelfull.com/the-alchemist-god.html",140),
            ("The Mightiest Leveling System","https://readnovelfull.com/the-mightiest-leveling-system-v1.html",233),
            ("World Domination System","https://readnovelfull.com/world-domination-system-v1.html",1167),
            ("Godly Student","https://readnovelfull.com/godly-student.html",2783),
          ]
          approved=[];held=[]
          for title,url,floor in candidates:
            try:
              d=discover(url)
              if norm(title)!=norm(d["title"]):
                raise ValueError("Book title mismatch")
              if d["numChapters"]<floor:
                raise ValueError("Source index shorter than historical edition")
              if d["status"] not in ("Completed","Ongoing"):
                raise ValueError("Unknown publication status")
              approved.append({"title":title,"url":url,"chapters":d["numChapters"]})
              print("POSTFIX_READY",title,d["numChapters"],flush=True)
            except Exception as e:
              held.append({"title":title,"reason":str(e)[:260]})
              print("POSTFIX_HELD",title,type(e).__name__,str(e)[:210],flush=True)
          Path("postfix-verified-indexes.json").write_text(
            json.dumps({"approved":approved,"held":held},indent=2,ensure_ascii=False)+"\n",
            encoding="utf-8")
          print("POSTFIX_VERIFIED",len(approved),"of",len(candidates),flush=True)
          PY
      - name: Save metadata-only preflight results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readnovelfull-typo-prefix-preflight-${{ github.run_id }}
          path: postfix-verified-indexes.json
          retention-days: 90
          if-no-files-found: warn
