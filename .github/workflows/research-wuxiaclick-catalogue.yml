name: Temporary - WuxiaClick Catalogue Completeness

on:
  push:
    branches:
      - research/http200-live-book-scenarios-20261115
    paths:
      - .github/workflows/research-wuxiaclick-catalogue.yml

permissions:
  contents: read

jobs:
  bounded-catalogue-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install beautifulsoup4==4.14.2
      - name: Check server-rendered index and last linked chapters without storing text
        run: |
          python -u - <<'PY'
          from bs4 import BeautifulSoup
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          
          DOMAIN = "wuxia.click"
          UA = "NovelLibraryFeasibility/1.0 (public-sample-only; github.com/RichardDaffern/Novel_Library)"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          client = urllib.request.build_opener(NoRedirect())
          def get(url, limit=1300000):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "text/html"})
              try:
                  with client.open(req, timeout=12) as res:
                      data = res.read(limit + 1)
                      if len(data) > limit: return "oversized", b""
                      return res.status, data
              except urllib.error.HTTPError as exc:
                  return exc.code, b""
              except Exception as exc:
                  return type(exc).__name__, b""

          status, rb = get("https://wuxia.click/robots.txt", limit=80000)
          print("ROBOTS",status)
          if status != 200: raise SystemExit("No robots permission verified: stop")
          robots = urllib.robotparser.RobotFileParser()
          robots.parse(rb.decode("utf-8", errors="replace").splitlines())
          for slug in ("martial-world", "true-martial-world"):
              url = f"https://wuxia.click/novel/{slug}"
              if not robots.can_fetch(UA, url):
                  print(slug, "SKIPPED robots disallow");continue
              time.sleep(1)
              code, body = get(url)
              print(slug, "BOOK_STATUS", code, "HTML_BYTES", len(body))
              if code != 200: continue
              soup = BeautifulSoup(body, "html.parser")
              # DOM-visible count, independent of other text containing numbers.
              book_chapters = [a.get("href","") for a in soup.select("a[href]")
                               if re.fullmatch(r"/chapter/" + re.escape(slug) + r"-\d+", a.get("href",""))]
              book_chapters = list(dict.fromkeys(book_chapters))
              nums = [int(link.rsplit("-",1)[-1]) for link in book_chapters]
              print(slug, "VISIBLE_CHAPTERS", len(nums), "FIRST_LAST", (min(nums),max(nums)) if nums else None)
              raw = body.decode("utf-8",errors="replace")
              # Identify chapter references in hydration without scraping any prose.
              candidates = re.findall(r"/chapter/" + re.escape(slug) + r"-(\d+)\b", raw)
              number_list = sorted(set(map(int,candidates)))
              print(slug, "RAW_URL_REFERENCES", len(number_list),
                    "MIN_MAX", (number_list[0], number_list[-1]) if number_list else None,
                    "REFERENCE_COUNT", len(candidates))
              ranges = [el for el in soup.select("button") if re.fullmatch(r"[\d,]+\s*[-–]\s*[\d,]+",
                               el.get_text(" ",strip=True))]
              print(slug,"RANGE_BUTTONS",len(ranges),"FIRST_THREE",
                    [b.get_text(" ",strip=True) for b in ranges[:3]],"LAST",
                    ranges[-1].get_text(" ",strip=True) if ranges else None)
              queries = sorted({x.get("href","") for x in soup.select("a[href]")
                                if x.get("href","").startswith("?") or
                                (slug in x.get("href","") and "?" in x.get("href",""))})
              print(slug, "PAGINATION_LINKS", queries[:6])
              latest = next((x for x in soup.select("a[href]") if "latest" in x.get_text(" ",strip=True).lower()),None)
              if not latest:
                  print(slug, "LATEST_LINK", "missing");continue
              target = urllib.parse.urljoin(url,latest.get("href",""))
              p = urllib.parse.urlsplit(target)
              if p.scheme != "https" or p.hostname != DOMAIN or not re.fullmatch(
                    r"/chapter/"+re.escape(slug)+r"-\d+",p.path):
                  print(slug,"LATEST_LINK","not a verified same-site numbered chapter");continue
              print(slug,"LATEST_PATH",p.path)
              if not robots.can_fetch(UA,target):
                  print(slug,"LATEST_SKIPPED robots disallow");continue
              time.sleep(1)
              st,chapter = get(target, limit=640000)
              print(slug,"LATEST_STATUS",st,"HTML_BYTES",len(chapter))
              if st == 200:
                  cs = BeautifulSoup(chapter,"html.parser")
                  node=cs.select_one("#chapter-content")
                  h=cs.select_one("h1") or cs.select_one("h2")
                  print(slug,"LATEST_STRUCT",
                        "HEADING",repr(h.get_text(" ",strip=True)[:65] if h else None),
                        "CONTENT_LENGTH",len(node.get_text(" ",strip=True)) if node else None)
              # No novel body text is logged or saved.
          PY
