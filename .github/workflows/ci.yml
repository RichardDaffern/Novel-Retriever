name: CI

on:
  push:
  # Download-registry PRs only change metadata. These are created by
  # github-actions[bot] and can end up with "Action required" before CI runs.
  # PRs changing any other file still receive the full Linux/Windows/ZIP CI.
  pull_request:
    paths-ignore:
      - 'DOWNLOADED_NOVELS.md'
      - 'downloaded_novels.json'

# Superseded pushes and PR updates should not queue full CI repeatedly.
# The latest commit is always validated; main has its own independent group.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Verify inclusive range creates two chapter files
        run: |
          python -u novel_downloader.py --self-test --chapter-range 3-4 --output-dir smoke
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('smoke/fanficfare-smoke-test-chapters-0003-0004')
          rows = json.loads((p/'chapters.json').read_text())
          assert len(rows)==2, f'Expected 2 chapters, got {len(rows)}'
          assert [row['position'] for row in rows]==[3, 4]
          assert all((p/row['file']).stat().st_size>20 for row in rows)
          assert (p/'source.epub').stat().st_size>1000
          print('Two individual TXT files and partial EPUB created')
          PY
      - name: Verify independent batches combine into one EPUB (offline)
        run: |
          python -u -m tools.chunked_download plan --self-test --chapter-range 1-4 --chunk-size 2 --plan-file ci_plan.json
          KEY=$(python -c "from tools.chunked_download import identity,SYNTHETIC_URL;print(identity(SYNTHETIC_URL))")
          python -u -m tools.chunked_download fetch --self-test --key "$KEY" --start 1 --end 2 --output-dir "ci_parts/chapter-batch-${KEY}-00001-00002" --scratch-dir ci_scratch1
          python -u -m tools.chunked_download fetch --self-test --key "$KEY" --start 3 --end 4 --output-dir "ci_parts/chapter-batch-${KEY}-00003-00004" --scratch-dir ci_scratch2
          python -u -m tools.chunked_download assemble --self-test --plan-file ci_plan.json --chunks-dir ci_parts --output-dir ci_combined
          python - <<'PY'
          import json
          from pathlib import Path
          from novel_downloader import epub_chapters
          book = Path('ci_combined/fanficfare-smoke-test')
          rows = json.loads((book / 'chapters.json').read_text())
          assert [r['position'] for r in rows] == [1, 2, 3, 4]
          assert all((book / r['file']).stat().st_size > 30 for r in rows)
          _, chapters = epub_chapters(book / 'source.epub')
          assert len(chapters) == 4
          print('Verified four distinct synthetic TXT chapters and one reassembled EPUB')
          PY
      - name: Check NovelFull chapter discovery (no chapter text downloaded)
        continue-on-error: true
        timeout-minutes: 6
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u novel_downloader.py "https://novelfull.com/interstellar-era-starting-as-a-cleaner.html" --confirm-rights --list-only > /tmp/novelfull-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/novelfull-metadata.json').read_text())
          count = int(data.get('numChapters', 0))
          assert count >= 1, f'Expected at least one chapter link, got {count}'
          print(f'NovelFull adapter chapter discovery succeeded: {count} entries (metadata only)')
          PY
      - name: Check synthetic 20, 50 and 100-novel bulk planner load
        run: python -m tools.bulk_download_stress --json-output synthetic_bulk_stress.json
      - name: Publish synthetic bulk stress results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-bulk-stress-results
          path: synthetic_bulk_stress.json
          retention-days: 3
          if-no-files-found: error

      - name: Upload two-chapter synthetic test output
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: two-chapter-smoke-test
          path: smoke/
          retention-days: 3
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Verify optional ZIP covers and old ZIP compatibility on Windows
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/cover_zip_smoke.ps1
      - name: Validate one-click downloader syntax and launcher path
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/download_all_artifacts.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell syntax validation failed'
          }
          if (-not (Test-Path 'Download-All-Novels.cmd')) { throw 'Windows launcher is missing' }
          if (-not ((Get-Content 'Download-All-Novels.cmd' -Raw) -like '*tools\download_all_artifacts.ps1*')) { throw 'Launcher does not invoke downloader' }
          # Parse with Windows PowerShell 5.1, the same executable used by the CMD launcher.
          $legacyErrors = $null
          $legacyParser = @'
          $path = (Resolve-Path 'tools/download_all_artifacts.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          '@
          $legacyParser | powershell.exe -NoProfile -NonInteractive -Command -
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 parse failed' }
          # Simulate a parameter-validation error before contacting GitHub. This
          # catches CMD parentheses bugs that would skip the final pause.
          $output = & cmd.exe /d /c 'echo.|call "Download-All-Novels.cmd" -Limit -1' 2>&1 | Out-String
          if ($output -notmatch 'ERROR: Downloader exited with code') { throw "Launcher hid its error: $output" }
          if ($output -notmatch 'Press any key to close this window') { throw "Launcher did not reach its pause: $output" }
          if ($LASTEXITCODE -eq 0) { throw "The simulated launcher failure unexpectedly exited successfully: $output" }
          # Expected negative test: clear the native command's nonzero code so
          # the pwsh GitHub Actions step itself finishes successfully.
          $global:LASTEXITCODE = 0
          # Positive startup regression: PowerShell 5.1 must bind parameters
          # and resolve the default folder, even when its path has spaces.
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'Novel Library With Spaces'
          $smokeTools = Join-Path $smokeRoot 'tools'
          New-Item -ItemType Directory -Force -Path $smokeTools | Out-Null
          Copy-Item 'tools/download_all_artifacts.ps1' (Join-Path $smokeTools 'download_all_artifacts.ps1')
          Copy-Item 'tools/zip_novel_artifacts.ps1' (Join-Path $smokeTools 'zip_novel_artifacts.ps1')
          $smokeScript = Join-Path $smokeTools 'download_all_artifacts.ps1'
          $startup = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $smokeScript -BrowserLogin -CheckSetup 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 failed at argument binding/startup: $startup" }
          if ($startup -notmatch 'Startup self-check passed') { throw "Missing startup success message: $startup" }
          if (-not $startup.Contains((Join-Path $smokeRoot 'Downloaded_Novels'))) { throw "Incorrect default download path: $startup" }
          if (-not (Test-Path (Join-Path $smokeRoot 'download-last-run.log'))) { throw "Startup did not create the diagnostic log: $startup" }
          Write-Host 'PowerShell 5.1 and launcher failure path verified (no network requests)'
      - name: Verify chunked EPUB assembly on Windows (offline)
        shell: pwsh
        run: |
          python -m tools.chunked_download plan --self-test --chapter-range 1-4 --chunk-size 2 --plan-file ci_plan_win.json
          $Key = python -c "from tools.chunked_download import identity,SYNTHETIC_URL;print(identity(SYNTHETIC_URL))"
          python -m tools.chunked_download fetch --self-test --key "$Key" --start 1 --end 2 --output-dir "ci_win_parts/chapter-batch-$Key-00001-00002" --scratch-dir ci_win_scratch1
          python -m tools.chunked_download fetch --self-test --key "$Key" --start 3 --end 4 --output-dir "ci_win_parts/chapter-batch-$Key-00003-00004" --scratch-dir ci_win_scratch2
          python -m tools.chunked_download assemble --self-test --plan-file ci_plan_win.json --chunks-dir ci_win_parts --output-dir ci_win_combined
          python -c "import json,pathlib; b=pathlib.Path('ci_win_combined/fanficfare-smoke-test'); assert len(json.loads((b/'chapters.json').read_text()))==4; assert (b/'source.epub').is_file(); print('Windows combined EPUB and TXT verified')"
      - name: Verify 2-chapter range with TXT and EPUB on Windows
        run: |
          python -u novel_downloader.py --self-test --chapter-range 3-4 --output-dir smoke
          python -c "import pathlib,json; p=pathlib.Path('smoke/fanficfare-smoke-test-chapters-0003-0004'); assert len(json.loads((p/'chapters.json').read_text()))==2; print('Windows chapters verified')"

  zip-archive-smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate one-novel ZIP conversion (no external dependencies)
        run: python -m unittest discover -s tests -p test_zip_packaging_windows.py -v

  cleanup-verified-merged-branches-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cleanup/remove-superseded-docs-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Delete only obsolete merged branch refs with unchanged SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["GH_REPO"]
          if repo != "RichardDaffern/Novel-Retriever":
              raise SystemExit("Refusing cleanup outside target repository.")
          items = json.loads(r'''[{"branch":"docs/ai-agent-technical-handbook-20261113","sha":"d02dbe893b5ef3db96d53ffa40a72b59884425c6","pr":129},{"branch":"docs/scribblehub-feasibility-20261114","sha":"42fd74531c14068e9bc0aec3830087f15ec7b4c1","pr":131},{"branch":"docs/streamline-readme-and-site-support-20261114","sha":"0beb70eba74c0a181d1e61fd4b2987e39746f7a3","pr":130},{"branch":"feat/pdf-to-novel-converter","sha":"42870be4661bf352db18cd73ee3e50de211ef6cd","pr":124},{"branch":"feat/pdf-to-novel-one-click-cmd","sha":"7d814bbe7bc8e62b5898ca1a5195c43cd29583cc","pr":125},{"branch":"feature/bulk-performance-timing-artifact-scope-20261115","sha":"2a41c5f2fcd2ec949840c18678ffc0d559cedac3","pr":141},{"branch":"feature/bulk-retry-loadtest-recovery-drill-20261115","sha":"0080ff8e46c01ee4469245d51232ecb94e82df28","pr":140},{"branch":"feature/bulk-scribblehub-uncap-preserve-partial-20261114","sha":"0d83c5f063f4f7d639ea0496d4b206828fcdca56","pr":139},{"branch":"feature/scribblehub-authorised-epub-import-20261114","sha":"a728fe770135faeca41d18da063144a7903a1263","pr":134},{"branch":"feature/scribblehub-verified-crosspost-action-20261114","sha":"c4d2867b3197aa9def72db4c4a27b59078aa2943","pr":136},{"branch":"feature/verified-scribblehub-crosspost-url-download-20261114","sha":"6d763eafc64b8d45ad7d38ff7d5dcd5fe320d507","pr":135},{"branch":"fix/fichub-export-error-reporting-20261114","sha":"a88a3ea2c9d5ef16311a7f5ce29ee3fb4f2d7fa7","pr":137},{"branch":"fix/novel-integrity-audit-20261111","sha":"6fd931c13668e013aba774016f89672e01fb252a","pr":127},{"branch":"fix/preserve-novel-genres-from-batches","sha":"ce0f198a1a31793e810d7c88150cdb5b81999ee0","pr":126},{"branch":"fix/windows-chapter-hash-bytes-20261114","sha":"cde55ca02eeae15e0322cad7aa4af26e5f391327","pr":132},{"branch":"registry/download-43734388839-4a3df5f24e47e43c7b9e","sha":"bd8722959d0240907c9f10bd115d66b92b836716","pr":231},{"branch":"registry/download-43734388839-599969b1a23d17191dfb","sha":"518fe9cacf9e36bff83165c3b0e2ed5e6926989c","pr":230},{"branch":"registry/download-43734388839-a55de2084a8e35bf6197","sha":"e0d0d166a6c6fb7fc89227185ec587df3d2e49e0","pr":229},{"branch":"registry/download-43734398943-94f0aabcb673d7f7687d","sha":"fe6ff901c70814d8d87bdb0cf369c8ab0a0c64a5","pr":228},{"branch":"registry/download-43734410920-78f303ecbb284a62defe","sha":"1b0d6dde25e166d94501b10c2b9729134f97df82","pr":226},{"branch":"test/postmerge-safety-regressions-20261111","sha":"f2caaba319ce5a5ec5b3980b06d93a1cd7bc4e2e","pr":128},{"branch":"test/scribblehub-offline-evidence-20261114","sha":"da976a1097f4961e1fb8a71cdf53a9d6e6b8aa1b","pr":133}]''')
          def gh(endpoint, method=None):
              command = ["gh", "api"]
              if method:
                  command.extend(["-X", method])
              command.append(endpoint)
              result = subprocess.run(command, capture_output=True, text=True, timeout=45)
              if result.returncode:
                  raise RuntimeError(f"GitHub API rejected request: {endpoint}: {result.stderr[-400:]}")
              return json.loads(result.stdout) if result.stdout.strip() else None
          deleted = []
          for item in items:
              branch, old_sha, number = item["branch"], item["sha"], item["pr"]
              pr = gh(f"repos/{repo}/pulls/{number}")
              if not (pr["merged_at"] and pr["state"] == "closed"
                      and pr["head"]["ref"] == branch
                      and pr["head"]["repo"] is not None
                      and pr["head"]["repo"]["full_name"] == repo):
                  raise RuntimeError(f"PR #{number} no longer proves {branch} was merged")
              current = gh(f"repos/{repo}/git/ref/heads/{branch}")
              if current["object"]["sha"] != old_sha:
                  print(f"SKIPPED moved branch {branch}", flush=True)
                  continue
              gh(f"repos/{repo}/git/refs/heads/{branch}", "DELETE")
              deleted.append(branch)
              print(f"DELETED {branch} (merged PR #{number})", flush=True)
          print(f"COMPLETE: {len(deleted)} verified merged branches deleted", flush=True)
          PY
