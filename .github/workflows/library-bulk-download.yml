name: Library - Bulk Download

on:
  workflow_dispatch:
    inputs:
      novel_urls:
        description: 'Novel links from any supported website (comma, space or semicolon separated)'
        required: false
        type: string
      novel_names:
        description: 'Optional saved novel titles, separated by comma or semicolon'
        required: false
        type: string
      chapter_range:
        description: 'Optional chapter range for every selected book (e.g. 1-2)'
        required: false
        type: string
      force:
        description: 'Redownload even if an available archive exists'
        required: false
        type: boolean
        default: false
      confirm_rights:
        description: 'I have explicit rights to archive and publicly share every selected work through public GitHub Actions artefacts'
        required: true
        type: boolean
        default: false
      rights_evidence_url:
        description: 'Separate HTTPS author/rights-holder permission or licence page covering every selected work. A public book listing is not evidence.'
        required: true
        type: string
      retry_run_id:
        description: 'Optional previous bulk run ID; retry only failed or missing novels'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_novelfull: ${{ steps.plan.outputs.has_novelfull }}
      novelfull_matrix: ${{ steps.plan.outputs.novelfull_matrix }}
      has_freewebnovel: ${{ steps.plan.outputs.has_freewebnovel }}
      freewebnovel_matrix: ${{ steps.plan.outputs.freewebnovel_matrix }}
      has_readnovelfull: ${{ steps.plan.outputs.has_readnovelfull }}
      readnovelfull_matrix: ${{ steps.plan.outputs.readnovelfull_matrix }}
      has_wuxiaclick: ${{ steps.plan.outputs.has_wuxiaclick }}
      wuxiaclick_matrix: ${{ steps.plan.outputs.wuxiaclick_matrix }}
      has_scribblehub: ${{ steps.plan.outputs.has_scribblehub }}
      scribblehub_matrix: ${{ steps.plan.outputs.scribblehub_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Require explicit rights evidence before planning public artefacts
        env:
          CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
          RIGHTS_EVIDENCE_URL: ${{ inputs.rights_evidence_url }}
          NOVEL_URLS: ${{ inputs.novel_urls }}
        run: |
          python tools/rights_gate.py --confirm-rights "$CONFIRM_RIGHTS" --evidence-url "$RIGHTS_EVIDENCE_URL" --source-urls "$NOVEL_URLS"
      - name: Install catalogue dependencies
        run: python -m pip install -r requirements.lock
      - name: Validate previous bulk run ID and exclusive retry inputs
        if: ${{ inputs.retry_run_id != '' }}
        env:
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          NAMES: ${{ inputs.novel_names }}
          URLS: ${{ inputs.novel_urls }}
          CHAPTER_RANGE: ${{ inputs.chapter_range }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import os
          import re

          value = os.environ["RETRY_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]{0,19}", value):
              raise SystemExit("Retry run ID must be a numeric GitHub Actions run ID.")
          if (os.environ["NAMES"].strip() or os.environ["URLS"].strip()
                  or os.environ["CHAPTER_RANGE"].strip()
                  or os.environ["FORCE"] == "true"):
              raise SystemExit(
                  "To retry a previous run, leave novel links, saved titles, "
                  "chapter range blank and Force off."
              )
          PY

      - name: Fetch previous small recovery manifest only
        if: ${{ inputs.retry_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bulk-recovery-manifest-${{ inputs.retry_run_id }}
          run-id: ${{ inputs.retry_run_id }}
          github-token: ${{ github.token }}
          path: previous_recovery

      - name: Automatically detect source for each link and check registry
        id: plan
        env:
          NOVEL_NAMES: ${{ inputs.novel_names }}
          NOVEL_URLS: ${{ inputs.novel_urls }}
          CHAPTER_RANGE: ${{ inputs.chapter_range }}
          FORCE: ${{ inputs.force }}
          CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
        run: |
          args=(python -m tools.mixed_source_bulk plan \
            --names "$NOVEL_NAMES" --urls "$NOVEL_URLS" \
            --chapter-range "$CHAPTER_RANGE")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          if [[ "$CONFIRM_RIGHTS" == "true" ]]; then args+=(--confirm-rights); fi
          if [[ -n "$RETRY_RUN_ID" ]]; then
            args+=(--retry-manifest previous_recovery/bulk_recovery_manifest.json --retry-run-id "$RETRY_RUN_ID")
          fi
          "${args[@]}"

      - name: Preserve planned novel selection for partial recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bulk-selection-${{ github.run_id }}
          path: library_bulk_plan.json
          retention-days: 90
          if-no-files-found: error

  novelfull:
    needs: prepare
    if: needs.prepare.outputs.has_novelfull == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.novelfull_matrix) }}
    uses: ./.github/workflows/download-novel.yml
    with:
      novel_url: ${{ matrix.novel_url }}
      chapter_range: ${{ matrix.chapter_range }}
      force: ${{ matrix.force }}
      confirm_rights: ${{ inputs.confirm_rights }}
      rights_evidence_url: ${{ inputs.rights_evidence_url }}
    permissions:
      contents: write
      pull-requests: write
      actions: read

  freewebnovel:
    needs: prepare
    if: needs.prepare.outputs.has_freewebnovel == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.freewebnovel_matrix) }}
    uses: ./.github/workflows/freewebnovel-download.yml
    with:
      novel_url: ${{ matrix.novel_url }}
      chapter_range: ${{ matrix.chapter_range }}
      force: ${{ matrix.force }}
      confirm_rights: ${{ inputs.confirm_rights }}
      rights_evidence_url: ${{ inputs.rights_evidence_url }}
    permissions:
      contents: write
      pull-requests: write
      actions: read

  readnovelfull:
    needs: prepare
    if: needs.prepare.outputs.has_readnovelfull == 'true'
    strategy:
      fail-fast: false
      # One novel at a time, with at most two paced chapter batches.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.readnovelfull_matrix) }}
    uses: ./.github/workflows/readnovelfull-download.yml
    with:
      novel_url: ${{ matrix.novel_url }}
      chapter_range: ${{ matrix.chapter_range }}
      force: ${{ matrix.force }}
      confirm_rights: ${{ inputs.confirm_rights }}
      rights_evidence_url: ${{ inputs.rights_evidence_url }}
    permissions:
      contents: write
      pull-requests: write
      actions: read

  wuxiaclick:
    needs: prepare
    if: needs.prepare.outputs.has_wuxiaclick == 'true'
    strategy:
      fail-fast: false
      # Do not parallelise WuxiaClick novels or bypass its daily allowance.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.wuxiaclick_matrix) }}
    uses: ./.github/workflows/wuxiaclick-download.yml
    with:
      novel_url: ${{ matrix.novel_url }}
      chapter_range: ${{ matrix.chapter_range }}
      force: ${{ matrix.force }}
      confirm_rights: ${{ inputs.confirm_rights }}
      rights_evidence_url: ${{ inputs.rights_evidence_url }}
    permissions:
      contents: write
      pull-requests: write
      actions: read

  scribblehub:
    needs: prepare
    if: needs.prepare.outputs.has_scribblehub == 'true'
    strategy:
      fail-fast: false
      # FicHub asks for serial requests, not simultaneous export jobs.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.scribblehub_matrix) }}
    uses: ./.github/workflows/scribblehub-download.yml
    with:
      novel_url: ${{ matrix.novel_url }}
      force: ${{ matrix.force }}
      confirm_rights: ${{ inputs.confirm_rights }}
      rights_evidence_url: ${{ inputs.rights_evidence_url }}
    permissions:
      contents: write
      pull-requests: write
      actions: read

  summary:
    needs: [prepare, novelfull, freewebnovel, readnovelfull, wuxiaclick, scribblehub]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bulk summary tools
        if: always() && needs.prepare.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # A successful run already publishes each completed book independently.
      # Download and repackage those large artefacts only after a child failure.
      - name: Decide whether partial recovery is needed
        id: recovery_gate
        if: always() && needs.prepare.result == 'success'
        env:
          NOVELFULL: ${{ needs.novelfull.result }}
          FREEWEBNOVEL: ${{ needs.freewebnovel.result }}
          READNOVELFULL: ${{ needs.readnovelfull.result }}
          WUXIACLICK: ${{ needs.wuxiaclick.result }}
          SCRIBBLEHUB: ${{ needs.scribblehub.result }}
        run: |
          for result in "$NOVELFULL" "$FREEWEBNOVEL" "$READNOVELFULL" "$WUXIACLICK" "$SCRIBBLEHUB"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "required=true" >> "$GITHUB_OUTPUT"
              echo "::notice::A child download failed or was cancelled; recovering completed novels."
              exit 0
            fi
          done
          echo "required=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No failed child downloads; each completed novel is already independently downloadable."

      - name: Retrieve selected novel plan
        if: always() && steps.recovery_gate.outputs.required == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bulk-selection-${{ github.run_id }}
          path: saved_plan

      - name: Collect successful per-novel artefacts even if other downloads failed
        if: always() && steps.recovery_gate.outputs.required == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: novel-${{ github.run_id }}-*
          path: collected_artifacts
          merge-multiple: false

      - name: Validate and package all completed novels separately
        id: recovery
        if: always() && steps.recovery_gate.outputs.required == 'true'
        run: |
          python -m tools.bulk_download_recovery \
            --plan saved_plan/library_bulk_plan.json \
            --artifacts collected_artifacts \
            --output recovery_output \
            --run-id "$GITHUB_RUN_ID" \
            --resolve-covers

      - name: Publish small retry manifest
        if: always() && needs.prepare.result == 'success' && steps.recovery.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bulk-recovery-manifest-${{ github.run_id }}
          path: recovery_output/bulk_recovery_manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish successful-novels recovery bundle even when the bulk run failed
        if: always() && steps.recovery.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bulk-successful-novels-${{ github.run_id }}
          path: recovery_output/
          retention-days: 90
          if-no-files-found: error
          # Each recovered novel is already a compressed ZIP.
          compression-level: 0

      - name: Measure completed download job timings
        id: timings
        if: always() && needs.prepare.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.workflow_performance \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --output bulk_performance.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish small performance report
        if: always() && steps.timings.outcome == 'success'
        # Telemetry must never turn a successful novel download into a failure.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bulk-performance-${{ github.run_id }}
          path: bulk_performance.json
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Summarise grouped website downloads
        if: always()
        env:
          PREPARE: ${{ needs.prepare.result }}
          NOVELFULL: ${{ needs.novelfull.result }}
          FREEWEBNOVEL: ${{ needs.freewebnovel.result }}
          READNOVELFULL: ${{ needs.readnovelfull.result }}
          WUXIACLICK: ${{ needs.wuxiaclick.result }}
          SCRIBBLEHUB: ${{ needs.scribblehub.result }}
          RECOVERY: ${{ steps.recovery.outcome }}
          RIGHTS_EVIDENCE_URL: ${{ inputs.rights_evidence_url }}
        run: |
          echo "## Grouped bulk result" >> "$GITHUB_STEP_SUMMARY"
          echo "| Group | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Planning | $PREPARE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| NovelFull | $NOVELFULL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FreeWebNovel | $FREEWEBNOVEL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ReadNovelFull | $READNOVELFULL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| WuxiaClick | $WUXIACLICK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scribble Hub | $SCRIBBLEHUB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Partial recovery | $RECOVERY |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rights evidence URL (manual review required): $RIGHTS_EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Independently completed novels retain their original individual artefacts." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RECOVERY" == "success" ]]; then
            echo "Partial failure: bulk-successful-novels-$GITHUB_RUN_ID contains one portable ZIP per recovered book." >> "$GITHUB_STEP_SUMMARY"
            echo "To retry failed or missing books only, enter this run ID in Retry from previous run. The small bulk-recovery-manifest-$GITHUB_RUN_ID stores the missing selection." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RECOVERY" == "skipped" ]]; then
            echo "All child groups succeeded or were skipped. Duplicate recovery downloads and ZIP packaging were omitted to save time and transfers." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Partial recovery failed; independently uploaded successful novel artefacts remain available." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$PREPARE" == "failure" || "$PREPARE" == "cancelled" || \
                "$NOVELFULL" == "failure" || "$NOVELFULL" == "cancelled" || \
                "$FREEWEBNOVEL" == "failure" || "$FREEWEBNOVEL" == "cancelled" || \
                "$READNOVELFULL" == "failure" || "$READNOVELFULL" == "cancelled" || \
                "$WUXIACLICK" == "failure" || "$WUXIACLICK" == "cancelled" || \
                "$SCRIBBLEHUB" == "failure" || "$SCRIBBLEHUB" == "cancelled" || \
                "$RECOVERY" == "failure" ]]; then
            echo "::error::At least one grouped download failed or was cancelled."
            exit 1
          fi
