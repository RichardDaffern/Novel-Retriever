name: Temporary - NovelFull Standard Transport Smoke
on:
  push:
    branches:
      - feature/novelfull-standard-http-20261116
    paths:
      - .github/workflows/novelfull-transport-smoke.yml
permissions:
  contents: read
jobs:
  metadata-and-two-chapters:
    if: github.repository == 'RichardDaffern/Novel_Library'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Validate metadata-only and two-chapter EPUB using standard transport
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novelfull.com/a-will-eternal.html'
          python novel_downloader.py "$URL" --confirm-rights --list-only --timeout-minutes 5 > story_metadata.json
          python - <<'PY'
          import json
          with open('story_metadata.json', encoding='utf-8') as file:
              data=json.load(file)
          count=data.get('numChapters',len(data.get('zchapters',[])))
          print('METADATA_TITLE',data.get('title'),flush=True)
          print('METADATA_CHAPTER_COUNT',count,flush=True)
          assert int(count)>=10, 'Chapter index is incomplete'
          PY
          python novel_downloader.py "$URL" --confirm-rights --chapter-range '1-2' --timeout-minutes 5 --output-dir smoke_novels
          python - <<'PY'
          import json
          from pathlib import Path
          output=list(Path('smoke_novels').rglob('chapters.json'))
          assert len(output)==1, f'Expected one validated book, got {len(output)}'
          manifest=json.loads(output[0].read_text(encoding='utf-8'))
          assert len(manifest)==2, f'Expected 2 chapter entries, got {len(manifest)}'
          assert all((output[0].parent / item['file']).is_file() for item in manifest)
          assert (output[0].parent/'source.epub').is_file()
          print('EPUB_AND_CHAPTER_MANIFEST_VALIDATED',len(manifest),flush=True)
          PY
