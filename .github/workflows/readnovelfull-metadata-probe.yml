name: ReadNovelFull Metadata Probe (Temporary)

on:
  push:
    branches:
      - feature/readnovelfull-bulk-support-20261115
    paths:
      - .github/workflows/readnovelfull-metadata-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Inspect only the first archive URL shapes (no chapter prose)
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from tools.readnovelfull_source import (
              fetch_public_html, book_metadata, archive_url, validate_chapter_url
          )
          book = "https://readnovelfull.com/cultivation-online-v3.html"
          metadata = book_metadata(fetch_public_html(book), book)
          html = fetch_public_html(archive_url(metadata["novel_id"]))
          links = BeautifulSoup(html, "html.parser").select(".list-chapter li a[href]")
          print("Total chapter links:", len(links))
          invalid = []
          numbers = []
          prefixes = set()
          for a in links:
              url = urljoin(book, a["href"])
              try:
                  parsed, pos, prefix = validate_chapter_url(url)
                  numbers.append(pos)
                  prefixes.add(prefix)
              except ValueError as exc:
                  if len(invalid) < 20:
                      invalid.append((a["href"][:200], str(exc)))
          print("Invalid link samples:", invalid)
          print("Unique valid chapter numbers:", len(set(numbers)))
          print("Range:", (min(numbers), max(numbers)) if numbers else None)
          print("Shared chapter prefixes:", sorted(prefixes)[:10])
          print("Missing numbers (first 20):", sorted(set(range(1, max(numbers)+1)) - set(numbers))[:20] if numbers else [])
          PY
