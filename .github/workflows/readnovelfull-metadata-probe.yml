name: ReadNovelFull Metadata Probe (Temporary)

on:
  push:
    branches:
      - feature/readnovelfull-bulk-support-20261115
    paths:
      - .github/workflows/readnovelfull-metadata-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Inspect synopsis and first chapter selectors without saving text
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from tools.readnovelfull_source import (
              fetch_public_html, extract_chapter,
          )
          book = "https://readnovelfull.com/cultivation-online-v3.html"
          html = fetch_public_html(book)
          soup = BeautifulSoup(html, "html.parser")
          for selector in (".desc-text", ".desc", ".desc-text p", "#tab-description",
                           "#tab-description .desc-text", ".book-desc",
                           ".desc-text + p", ".desc-text + div", ".description"):
              nodes = soup.select(selector)
              examples = [(len(n.get_text(" ", strip=True)),
                           n.get_text(" ", strip=True)[:70]) for n in nodes[:3]]
              print("Book selector", selector, "nodes", len(nodes), "samples", examples)
          chapter = "https://readnovelfull.com/cultivation-online/chapter-1-cultivation-online.html"
          page = fetch_public_html(chapter)
          chapter_soup = BeautifulSoup(page, "html.parser")
          for selector in ("#chr-content", ".chr-c", ".chapter-content",
                           ".chapter-title", "h1", "h2"):
              nodes = chapter_soup.select(selector)
              print("Chapter selector", selector, "count", len(nodes),
                    "lengths", [len(n.get_text(" ", strip=True)) for n in nodes[:2]])
          verified = extract_chapter(page, number=1, title="Chapter 1")
          print("First chapter extraction valid; characters:", len(verified["text"]))
          PY
