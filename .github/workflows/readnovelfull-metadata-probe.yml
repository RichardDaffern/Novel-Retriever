name: ReadNovelFull Metadata Probe (Temporary)

on:
  push:
    branches:
      - feature/readnovelfull-bulk-support-20261115
    paths:
      - .github/workflows/readnovelfull-metadata-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Inspect only the first archive URL shapes (no chapter prose)
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from urllib.parse import urlsplit
          from tools.readnovelfull_source import (
              fetch_public_html, book_metadata, archive_url, validate_chapter_url
          )
          book = "https://readnovelfull.com/cultivation-online-v3.html"
          metadata = book_metadata(fetch_public_html(book), book)
          html = fetch_public_html(archive_url(metadata["novel_id"]))
          links = BeautifulSoup(html, "html.parser").select(".list-chapter li a[href]")
          print("Total chapter links:", len(links))
          for a in (links[:8] + links[-3:]):
              url = a["href"]
              print("Catalogue link:", url[:240])
              try:
                  print("Parsed:", validate_chapter_url(url)[:2])
              except ValueError as exc:
                  print("Rejected:", exc)
          PY
