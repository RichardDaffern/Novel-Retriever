name: ReadNovelFull Metadata Probe (Temporary)

on:
  push:
    branches:
      - feature/readnovelfull-bulk-support-20261115
    paths:
      - .github/workflows/readnovelfull-metadata-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Check ReadNovelFull public catalogue only (no chapter prose)
        run: |
          python -m tools.readnovelfull_downloader \
            "https://readnovelfull.com/cultivation-online-v3.html" \
            --list-only --confirm-rights
