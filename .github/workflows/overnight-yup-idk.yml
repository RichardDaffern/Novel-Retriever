name: Overnight - Verify Yup and Idk then download in paced batches

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/overnight/start-20261119.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: overnight-yup-idk-20261119
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install source-check dependencies
        run: python -m pip install -r requirements.lock
      - name: Preflight 90 global exclusions and 239 pending source candidates
        run: |
          python -m tools.overnight_queue preflight \
            --out overnight-preflight.json
      - name: Read public BOOK listings only, recording exact-title matches
        if: github.run_attempt == 1
        run: |
          python -u -m tools.overnight_queue discover \
            --out overnight-discovery.json --request-budget 500
      - name: Save overnight discovery and skipped-source report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overnight-discovery-${{ github.run_id }}
          path: |
            overnight-preflight.json
            overnight-discovery.json
          retention-days: 90
          if-no-files-found: warn

  dispatch-yup:
    needs: [discover]
    if: needs.discover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: overnight-discovery-${{ github.run_id }}
          path: .
      - name: Dispatch approved Yup source URLs, max four active bulk runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u -m tools.overnight_queue dispatch \
            --tier Yup --sources overnight-discovery.json \
            --out overnight-yup-dispatch.json --minutes 285
      - name: Save Yup queued and held entries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overnight-yup-dispatch-${{ github.run_id }}
          path: overnight-yup-dispatch.json
          retention-days: 90
          if-no-files-found: warn

  dispatch-idk:
    needs: [discover, dispatch-yup]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: overnight-discovery-${{ github.run_id }}
          path: .
      - name: Dispatch approved Idk URLs after Yup, max four active bulk runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u -m tools.overnight_queue dispatch \
            --tier Idk --sources overnight-discovery.json \
            --out overnight-idk-dispatch.json --minutes 285
      - name: Save Idk queued and held entries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overnight-idk-dispatch-${{ github.run_id }}
          path: overnight-idk-dispatch.json
          retention-days: 90
          if-no-files-found: warn
