name: Campaign - Preflight five new book chapter indexes

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/overnight/five-toc-preflight-20261121.json'

permissions:
  contents: read

concurrency:
  group: five-book-toc-preflight-20261121
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'RichardDaffern/Novel-Retriever' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Ensure audit was newly triggered once
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/overnight/five-toc-preflight-20261121.json' | grep -qx \
            'campaigns/overnight/five-toc-preflight-20261121.json'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned public source parser
        run: python -m pip install -r requirements.lock
      - name: Offline safety regression tests
        run: python -m unittest tests.test_five_book_toc_preflight -v
      - name: Verify only book metadata and public chapter indexes
        run: |
          python -u -m tools.five_book_toc_preflight \
            --manifest campaigns/overnight/five-toc-preflight-20261121.json \
            --out five-book-toc-preflight.json
      - name: Publish metadata-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: five-book-index-evidence-${{ github.run_id }}
          path: five-book-toc-preflight.json
          retention-days: 30
          if-no-files-found: warn
      - name: Summarise the boundaries
        if: always()
        run: |
          echo '## Five-book source integrity preflight' >> "$GITHUB_STEP_SUMMARY"
          echo 'Index-only audit; no chapter text fetched or stored.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Successful indexes do NOT establish authorisation to archive copyrighted content.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not dispatch a public complete-book ZIP without appropriate rights.' >> "$GITHUB_STEP_SUMMARY"
