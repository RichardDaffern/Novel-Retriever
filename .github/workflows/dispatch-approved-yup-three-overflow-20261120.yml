name: Campaign - Dispatch three additional reviewed pending Yup books

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/overnight/approved-yup-three-overflow-20261120.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: curated-yup-three-one-shot-20261120
  cancel-in-progress: false

jobs:
  launch:
    if: github.repository == 'RichardDaffern/Novel-Retriever'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require newly added one-time approved source manifest
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.run_attempt }}" != "1" ]]; then
            echo "::error::Workflow reruns cannot dispatch books twice"
            exit 1
          fi
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/overnight/approved-yup-three-overflow-20261120.json' | grep -qx \
            'campaigns/overnight/approved-yup-three-overflow-20261120.json'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify approved-source filtering tests offline
        run: python -m unittest tests.test_dispatch_verified_yup_wave -v
      - name: Start one larger, unforced bulk download
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u -m tools.dispatch_verified_yup_wave \
            --manifest campaigns/overnight/approved-yup-three-overflow-20261120.json \
            --output curated-yup-overflow-dispatch-report.json
      - name: Retain source-checked dispatch report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curated-yup-overflow-dispatch-${{ github.run_id }}
          path: curated-yup-overflow-dispatch-report.json
          retention-days: 90
          if-no-files-found: warn
