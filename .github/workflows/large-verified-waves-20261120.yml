name: Campaign - Large verified Yup and Idk download waves

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/overnight/activate-large-waves-20261120.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: large-verified-downloads-20261120
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'RichardDaffern/Novel-Retriever'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce a newly added one-time activation
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/overnight/activate-large-waves-20261120.json' | grep -qx \
            'campaigns/overnight/activate-large-waves-20261120.json'
          if [[ "${{ github.run_attempt }}" != 1 ]]; then
            echo "::error::Do not re-run this dispatcher; it can cause duplicates"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned public-source research dependencies
        run: python -m pip install -r requirements.lock
      - name: Offline preflight on source lists and 90 red exclusions
        run: |
          python -m tools.overnight_queue preflight \
            --out large-campaign-preflight.json
      - name: Verify live book listings without guessing a valid title
        run: |
          python -u -m tools.overnight_queue discover \
            --out large-campaign-discovery.json --request-budget 350
      - name: Publish source evidence and unresolved list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: large-wave-source-audit-${{ github.run_id }}
          path: |
            large-campaign-preflight.json
            large-campaign-discovery.json
          retention-days: 90
          if-no-files-found: warn

  dispatch:
    needs: [discover]
    if: needs.discover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Obtain the source-verified exact-title audit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: large-wave-source-audit-${{ github.run_id }}
          path: incoming
      - name: Dispatch batches of TEN verified books, up to 40 total
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u -m tools.large_batch_dispatch \
            --source incoming/large-campaign-discovery.json \
            --blocked campaigns/overnight/blocked-full-retries-20261120.json \
            --out large-wave-dispatch-report.json \
            --max-books 40 --batch-size 10 --minutes 270
      - name: Publish exact queued, held and blocked results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: large-wave-dispatch-${{ github.run_id }}
          path: large-wave-dispatch-report.json
          retention-days: 90
          if-no-files-found: warn
