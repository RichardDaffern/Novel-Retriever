name: Fanfiction - Queued Naruto and Harry Potter Source Matches

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/fanfiction/start-20261119.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: fanfiction-one-shot-20261119
  cancel-in-progress: false

jobs:
  download-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require a newly added one-shot activation file
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/fanfiction/start-20261119.json' | grep -qx \
            'campaigns/fanfiction/start-20261119.json'

      - name: Validate 43 fanfictions and current download registry
        run: |
          python -m tools.fanfiction_campaign \
            --dry-run --output fanfiction-preflight.json

      - name: Queue only matched source URLs in small independently tracked runs
        if: github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u -m tools.fanfiction_campaign \
            --minutes 275 --output fanfiction-dispatch.json

      - name: Save completed, dispatched and held fanfiction reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fanfiction-dispatch-${{ github.run_id }}
          path: |
            fanfiction-preflight.json
            fanfiction-dispatch.json
          retention-days: 90
          if-no-files-found: warn

      - name: Report link to individual download pipelines
        if: success()
        run: |
          echo '## Naruto and Harry Potter fanfiction batch downloads' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only matching, reviewed FreeWebNovel source URLs were queued.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Novel text, private reader settings and Hugging Face data remain unchanged here.' >> "$GITHUB_STEP_SUMMARY"
          echo 'One-book ZIPs appear under the individual **Library - Bulk Download** workflow runs.' >> "$GITHUB_STEP_SUMMARY"
