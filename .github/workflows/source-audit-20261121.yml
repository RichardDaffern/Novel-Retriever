name: Campaign - Audit remaining Yup and Idk book sources

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/overnight/source-audit-20261121.json'

permissions:
  contents: read

concurrency:
  group: remaining-novel-source-audit-20261121
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'RichardDaffern/Novel-Retriever' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Permit only first addition of this one-time audit
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/overnight/source-audit-20261121.json' | grep -qx \
            'campaigns/overnight/source-audit-20261121.json'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned public-listing parser
        run: python -m pip install -r requirements.lock
      - name: Run offline discovery regression tests
        run: python -m unittest tests.test_overnight_queue -v
      - name: Check backlog and exclusions without downloads
        run: python -m tools.overnight_queue preflight --out source-audit-preflight.json
      - name: Check exact public book listings on all three supported hosts
        run: |
          python -u -m tools.overnight_queue discover \
            --request-budget 500 --out source-audit-results.json
      - name: Save small source evidence and unresolved titles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-audit-20261121-${{ github.run_id }}
          path: |
            source-audit-preflight.json
            source-audit-results.json
          retention-days: 30
          if-no-files-found: warn
      - name: Explain source lookup limits
        if: always()
        run: |
          echo "## Remaining Yup and Idk source audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only, exact-title public listings on NovelFull, ReadNovelFull and FreeWebNovel." >> "$GITHUB_STEP_SUMMARY"
          echo "No chapter files downloaded; no bulk download or HF upload triggered." >> "$GITHUB_STEP_SUMMARY"
          echo "Review matching editions, current chapter indexes and archival permission separately before dispatch." >> "$GITHUB_STEP_SUMMARY"
