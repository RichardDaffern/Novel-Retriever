name: Temporary - HTTP 200 Book Scenarios

on:
  push:
    branches:
      - research/http200-live-book-scenarios-20261115
    paths:
      - .github/workflows/research-http200-scenarios.yml

permissions:
  contents: read

jobs:
  bounded-public-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install HTML parser for metadata-only diagnostics
        run: python -m pip install beautifulsoup4==4.14.2
      - name: Probe allowed book and up to two chapter HTML samples per source
        shell: bash
        run: |
          python -u - <<'PY'
          import html
          import re
          import ssl
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          from bs4 import BeautifulSoup

          UA = "NovelLibraryFeasibility/1.0 (public-sample-only; github.com/RichardDaffern/Novel_Library)"
          BOOKS = {
              "wuxia.click": (
                  "https://wuxia.click/novel/martial-world",
                  "https://wuxia.click/novel/true-martial-world",
              ),
              "libread.com": (
                  "https://libread.com/libread/re-tales-of-the-rune-tech-sage-22188",
                  "https://libread.com/libread/ruling-martial-world-by-infinite-insect-swarms-144201",
              ),
              "novelbin.cc": (
                  "https://novelbin.cc/book/cultivation-being-immortal/",
              ),
          }
          # No redirects: redirected chapter URLs are reported, never followed.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(url, *, size=1000000, method="GET"):
              request = urllib.request.Request(url, method=method, headers={
                  "User-Agent": UA, "Accept": "text/html,text/plain;q=0.5",
              })
              try:
                  with opener.open(request, timeout=12) as response:
                      body = response.read(size + 1) if method == "GET" else b""
                      if len(body) > size:
                          return {"status": "TOO_LARGE", "body": b"", "type": "", "redirect": ""}
                      return {"status": response.status, "body": body,
                              "type": response.headers.get("Content-Type", ""),
                              "redirect": ""}
              except urllib.error.HTTPError as exc:
                  redirect = exc.headers.get("Location", "") if exc.headers else ""
                  return {"status": exc.code, "body": b"", "type": "",
                          "redirect": urllib.parse.urljoin(url, redirect) if redirect else ""}
              except (urllib.error.URLError, TimeoutError, ssl.SSLError) as exc:
                  return {"status": type(exc).__name__, "body": b"", "type": "", "redirect": ""}

          def canonical(href, base):
              url = urllib.parse.urljoin(base, href)
              p = urllib.parse.urlsplit(url)
              if (p.scheme != "https" or p.hostname != urllib.parse.urlsplit(base).hostname
                      or p.username or p.password or p.port or p.query):
                  return None
              return url.split("#", 1)[0]

          for domain, books in BOOKS.items():
              robots_url = "https://" + domain + "/robots.txt"
              robots = get(robots_url, size=128000)
              print(f"SITE {domain} robots_status={robots['status']}")
              if robots["status"] != 200:
                  print(f"SITE {domain} STOP: cannot verify robots; NO requests to books")
                  continue
              rp = urllib.robotparser.RobotFileParser()
              rp.parse(robots["body"].decode("utf-8", "replace").splitlines())
              chapter_sample_count = 0
              for book_url in books:
                  p = urllib.parse.urlsplit(book_url)
                  if p.hostname != domain:
                      raise RuntimeError("Source list URL does not match allowlisted host")
                  slug = p.path
                  if not rp.can_fetch(UA, book_url):
                      print(f"BOOK {domain} {slug} STOP robots_disallow")
                      continue
                  time.sleep(1)
                  result = get(book_url, size=2200000)
                  print(f"BOOK {domain} {slug} status={result['status']} bytes={len(result['body'])} redirect_host={urllib.parse.urlsplit(result['redirect']).hostname or '-'}")
                  if result["status"] != 200 or "html" not in result["type"].lower():
                      continue
                  soup = BeautifulSoup(result["body"], "html.parser")
                  title = soup.select_one("h1") or soup.select_one("title")
                  book_title = title.get_text(" ", strip=True)[:100] if title else "(none)"
                  visible = soup.get_text(" ", strip=True)
                  counts = sorted(set(
                      int(x.replace(",", "")) for x in re.findall(
                          r"(?i)(?:Chapters?\s*:?\s*|Total\s*:?\s*)([0-9][0-9,]{1,6})\b|(?i:([0-9][0-9,]{1,6}))\s*chapters?",
                          visible[:16000]
                      ) for x in x if x.replace(",", "").isdigit()
                  ))
                  # Search hrefs only, never construct guessed chapter links.
                  links = []
                  seen = set()
                  for a in soup.select("a[href]"):
                      url = canonical(a.get("href", ""), book_url)
                      if not url or url in seen:
                          continue
                      label = a.get_text(" ", strip=True)
                      path = urllib.parse.urlsplit(url).path
                      if "chapter" in path.lower() or re.search(r"(?i)\bchapter\s*\d", label):
                          seen.add(url)
                          links.append((url, label[:65]))
                  print(f"BOOKMETA {domain} title={book_title!r} counts={counts[:8]} chapter_links_in_html={len(links)}")
                  if links:
                      print(f"BOOKLINKS {domain} first={urllib.parse.urlsplit(links[0][0]).path!r} last={urllib.parse.urlsplit(links[-1][0]).path!r}")
                  else:
                      print(f"BOOKLINKS {domain} no HTML chapter links, possibly JS/paginated")
                  if chapter_sample_count >= 2:
                      continue
                  # One chapter sample from each book at most, two per domain.
                  for chapter_url, title in links[:1]:
                      path = urllib.parse.urlsplit(chapter_url).path
                      if not rp.can_fetch(UA, chapter_url):
                          print(f"CHAPTER {domain} {path} STOP robots_disallow")
                          break
                      time.sleep(1)
                      ch = get(chapter_url, size=640000)
                      print(f"CHAPTER {domain} {path} status={ch['status']} bytes={len(ch['body'])} redirect_host={urllib.parse.urlsplit(ch['redirect']).hostname or '-'}")
                      if ch["status"] == 200 and "html" in ch["type"].lower():
                          cs = BeautifulSoup(ch["body"], "html.parser")
                          candidates = ["#chapter-content", "#chr-content", ".chapter-content", ".chr-c", "#content", ".reading-content", "article", "main"]
                          matches = [(selector, len(cs.select_one(selector).get_text(" ", strip=True)))
                                     for selector in candidates if cs.select_one(selector)]
                          title2 = cs.select_one("h1") or cs.select_one("h2")
                          print(f"CHAPTERSTRUCT {domain} heading={(title2.get_text(' ', strip=True)[:70] if title2 else None)!r} text_container_lengths={matches[:8]}")
                          raw_text = cs.get_text(" ", strip=True).lower()
                          print(f"CHAPTERGUARD {domain} challenge={any(s in raw_text[:10000] for s in ['verify you are human','just a moment...','please enable javascript','captcha'])}")
                      chapter_sample_count += 1
              print(f"SITE {domain} completed metadata and bounded sampling (no text saved)")
          PY
