name: Temporary - WuxiaClick TOC Page Scenarios

on:
  push:
    branches:
      - research/http200-live-book-scenarios-20261115
    paths:
      - .github/workflows/research-wuxiaclick-toc-pages.yml

permissions:
  contents: read

jobs:
  bounded-toc-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: python -m pip install beautifulsoup4==4.14.2
      - name: Validate first, second, and final publicly linked catalogue pages
        run: |
          python -u - <<'PY'
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          from bs4 import BeautifulSoup
          ROOT="https://wuxia.click"
          UA="NovelLibraryFeasibility/1.0 (public-sample-only; github.com/RichardDaffern/Novel_Library)"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,text/plain"})
              try:
                  with opener.open(req,timeout=12) as response:
                      data=response.read(1200000)
                      return response.status,data
              except urllib.error.HTTPError as exc:
                  return exc.code,b""
              except Exception as exc:
                  return type(exc).__name__,b""
          st,body=fetch(ROOT+"/robots.txt")
          print("ROBOTS_STATUS",st)
          if st!=200: raise SystemExit("Robots not retrievable. Stop.")
          rp=urllib.robotparser.RobotFileParser();rp.parse(body.decode("utf-8","replace").splitlines())
          for slug in ("martial-world","true-martial-world"):
              base=ROOT+"/novel/"+slug
              if not rp.can_fetch(UA,base): print(slug,"DISALLOWED");continue
              time.sleep(1)
              status,page=fetch(base)
              print(slug,"BOOK",status)
              if status!=200:continue
              soup=BeautifulSoup(page,"html.parser")
              def chapters(doc):
                  paths=[]
                  for a in doc.select("a[href]"):
                      path=urllib.parse.urlsplit(urllib.parse.urljoin(base,a.get("href",""))).path
                      match=re.fullmatch("/chapter/"+re.escape(slug)+r"-(\d+)",path)
                      if match:
                          paths.append(int(match.group(1)))
                  return sorted(set(paths))
              pages=set()
              for a in soup.select("a[href]"):
                  href=urllib.parse.urljoin(base,a.get("href",""))
                  parsed=urllib.parse.urlsplit(href)
                  if parsed.hostname!="wuxia.click" or parsed.path!="/novel/"+slug:continue
                  number=urllib.parse.parse_qs(parsed.query).get("page",[])
                  if len(number)==1 and number[0].isdigit():pages.add(int(number[0]))
              nums=chapters(soup)
              print(slug,"FIRST_PAGE count",len(nums),"first_last",(nums[0],nums[-1]) if nums else None)
              print(slug,"LINKED_PAGE_NUMBERS",len(pages),"min_max",(min(pages),max(pages)) if pages else None)
              # Never guess pages or enumerate the full novel. Check only two linked pages.
              for page_num in [n for n in (2,max(pages) if pages else None) if n in pages]:
                  url=base+"?page="+str(page_num)+"#chapters"
                  if not rp.can_fetch(UA,url):
                      print(slug,"PAGE",page_num,"DISALLOWED")
                      continue
                  time.sleep(1)
                  st,body=fetch(url)
                  if st!=200:
                      print(slug,"PAGE",page_num,"STATUS",st)
                      continue
                  doc=BeautifulSoup(body,"html.parser")
                  chapter_ids=chapters(doc)
                  expected_start=(page_num-1)*100+1
                  print(slug,"PAGE",page_num,"STATUS",st,"CHAPTER_LINKS",len(chapter_ids),
                        "FIRST_LAST",(chapter_ids[0],chapter_ids[-1]) if chapter_ids else None,
                        "EXPECTED_FIRST_POSITION",expected_start,
                        "CONTINUOUS_URL_IDS",chapter_ids == list(range(chapter_ids[0],chapter_ids[-1]+1)) if chapter_ids else False)
          print("Bounded page validation complete. No chapter text downloaded, no exports.")
          PY
