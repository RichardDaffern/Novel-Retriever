name: NovelFull search listing parser probe 2
on:
  push:
    branches: [ops/novelfull-alias-search-20261124]
    paths: [.github/workflows/novelfull-result-probe2.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print first public search-result anchors
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse
          from html.parser import HTMLParser
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.rows=[];self.current=None
            def handle_starttag(self,t,at):
              a=dict(at)
              if t=='a' and a.get('href'):
                self.current={'href':a['href'],'text':''};self.rows.append(self.current)
            def handle_data(self,d):
              if self.current:self.current['text']+=d
            def handle_endtag(self,t):
              if t=='a':self.current=None
          for title in ['Legend of Swordsman','Tomb Raider King','City Lady Killer','Apotheosis']:
            u='https://novelfull.com/search?'+urllib.parse.urlencode({'keyword':title})
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'NovelRetriever-Book-Index/1.0'}),timeout=12) as f:body=f.read(200000).decode('utf8','ignore')
            doc=Links();doc.feed(body)
            anchors=[x for x in doc.rows if x['href'].endswith('.html') and x['text'].strip()]
            print('QUERY',title,'links',len(anchors),'first',anchors[:15],flush=True)
          PY